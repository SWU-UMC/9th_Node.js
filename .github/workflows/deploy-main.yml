name: deploy-main

on:
  push:
    branches:
      - "소리/main"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY_SORI" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 접속 별명 설정
          cat >>~/.ssh/config <<END
          Host umc_EC2
            HostName $EC2_HOST_SORI
            User $EC2_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          END

        env:
          EC2_USER: ubuntu
          EC2_HOST_SORI: ${{ secrets.EC2_HOST_SORI }}
          EC2_SSH_KEY_SORI: ${{ secrets.EC2_SSH_KEY_SORI }}

      - name: Copy Workspace
        run: |
          ssh umc_EC2 'sudo mkdir -p /opt/app'
          ssh umc_EC2 'sudo chown ubuntu:ubuntu /opt/app'
          scp -r ./[!.]* umc_EC2:/opt/app

      - name: Install dependencies
        run: |
          ssh umc_EC2 'npm install --prefix /opt/app/'

      - name: Copy systemd service file
        run: |
          ssh umc_EC2 '
            echo "[Unit]
            Description=UMC 9th Project
            After=network.target

            [Service]
            User=ubuntu
            ExecStart=/usr/bin/npm run dev --prefix /opt/app/
            Restart=always

            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/app.service
          '

      - name: Enable systemd service
        run: |
          ssh umc_EC2 'sudo systemctl daemon-reload'
          ssh umc_EC2 'sudo systemctl enable app'

      - name: Restart systemd service
        run: |
          ssh umc_EC2 'sudo systemctl restart app'